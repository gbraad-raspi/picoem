# Enable `+fma` on x86 hosts so `f32::mul_add` / `f64::mul_add` inline to a
# hardware fused op instead of calling the correctly-rounded `fmaf`/`fma`
# libm fallback. This is a performance optimisation, not a correctness
# requirement: Rust's `mul_add` performs a single rounding on every target,
# so the emulator and the reference oracle agree bit-for-bit either way.
#
# The cfg form covers every x86_64 triple (gnu, msvc, musl, ...). Do not
# extend this to AArch64: rustc treats `fma` as an unknown target feature
# there even though the hardware instruction is part of the base FP/SIMD ISA.
#
# NOTE: an exported `RUSTFLAGS` / `CARGO_ENCODED_RUSTFLAGS`, even an empty
# one, *replaces* these flags instead of adding to them. If FMA codegen
# matters, leave RUSTFLAGS unset (`unset RUSTFLAGS`) or repeat the flag.
#
# See `fp_fma` in `crates/rp2350-emu/src/core/execute_fpu.rs` and `ref_fma`
# in `crates/picoem-harness/src/ieee754_ref.rs`.

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-feature=+fma"]
